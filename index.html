<!DOCTYPE html>
<html lang="pt-BR" class="min-h-screen">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GAD - Gestão de Agência Digital: conecte agências, redatores, designers e clientes em um fluxo de aprovação colaborativo." />
  <meta name="theme-color" content="#131722" />
  <title>GAD - Gestão de Agência Digital</title>
  <link rel="icon" type="image/png" href="/favicon.png" />

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('gad_theme');
        if (saved !== 'light') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="min-h-screen bg-surface-100/70 text-surface-800 dark:bg-surface-900 dark:text-surface-100 font-sans antialiased selection:bg-brand-500 selection:text-surface-50 flex flex-col transition-colors duration-200">
  <div id="app" class="min-h-screen flex flex-col"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
